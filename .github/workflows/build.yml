name: Build Porky3105 IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Default Xcode version:"
          xcodebuild -version || true
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build Application
        run: |
          xcodebuild clean build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "3105.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: 3105.app not found in build directory!"
            find build/DerivedData -type d
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          codesign --force --deep --sign - Payload/3105.app || true
          zip -qr9 Porky3105.ipa Payload
          shasum -a 256 Porky3105.ipa > Porky3105.ipa.sha256
          ls -lh Porky3105.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Porky3105-ipa
          path: |
            Porky3105.ipa
            Porky3105.ipa.sha256
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0-${{ github.run_number }}
          name: Porky 3105 v2.0 (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: |
            Porky3105.ipa
            Porky3105.ipa.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
